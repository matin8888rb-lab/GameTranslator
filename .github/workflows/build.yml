name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update zip
        run: |
          if [ -f GameTranslator-updated.zip ]; then
            unzip -q -o GameTranslator-updated.zip -d _upd
            rsync -a --exclude '.github' _upd/*/ ./
            rm -rf _upd GameTranslator-updated.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Apply update" || true
            git push || true
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Download Persian font
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/font.ttf \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf || echo "no font"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
